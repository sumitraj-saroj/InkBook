name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Build & Release Linux (AppImage & Pacman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Run strict type checking
        run: npm run typecheck

      - name: Run code linter
        run: npm run lint

      - name: Build application bundle
        run: npm run build

      - name: Package Linux targets (AppImage & pacman)
        run: npx electron-builder --linux AppImage pacman

      - name: Inspect generated artifacts
        run: ls -lh dist/

      - name: Create Draft GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.pacman
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
