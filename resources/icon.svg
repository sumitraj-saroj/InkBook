<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App icon base with rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Notebook cover background -->
  <rect x="88" y="80" width="336" height="352" rx="24" fill="url(#coverGrad)"/>
  
  <!-- Spine stripe on the left -->
  <path d="M88 104 C88 90.7 98.7 80 112 80 L140 80 L140 432 L112 432 C98.7 432 88 421.3 88 408 Z" fill="#2563eb"/>
  
  <!-- White paper page -->
  <rect x="148" y="96" width="260" height="320" rx="12" fill="url(#pageGrad)"/>
  
  <!-- Ruled horizontal lines on page -->
  <line x1="172" y1="150" x2="384" y2="150" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="190" x2="384" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="230" x2="384" y2="230" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="270" x2="384" y2="270" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="310" x2="384" y2="310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="350" x2="384" y2="350" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <line x1="172" y1="390" x2="384" y2="390" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Vertical red/coral margin line -->
  <line x1="210" y1="96" x2="210" y2="416" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.75"/>
  
  <!-- Stylized drawing curve on page -->
  <path d="M225 210 Q280 170 330 220 T370 300" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Stylized nib / pen tip in bottom right corner -->
  <polygon points="360,280 395,290 380,325 365,305" fill="#f59e0b"/>
  <circle cx="365" cy="295" r="3" fill="#1e293b"/>
</svg>
